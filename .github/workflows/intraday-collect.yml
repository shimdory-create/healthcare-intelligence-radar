name: Intraday collection

# Calls /api/cron/enrich (collection + AI analysis + dedupe, no report/send) several times
# during KST business hours -- see docs/market-intelligence-report-style-guide.md and the
# project memory for why: a single once-daily collection pass was taking 100+ seconds (24
# sources' DB round trips queuing up against each other) and leaving almost no time budget
# for AI analysis. Splitting collection across the day means each run only has a couple of
# hours' worth of new articles, so both collection and AI analysis comfortably fit.
#
# Runs via GitHub Actions rather than a second Vercel cron because Vercel's free (Hobby) plan
# only allows a cron to fire once a day -- this project stays on that plan, so the intraday
# schedule lives here instead, calling the same CRON_SECRET-protected endpoint the Vercel cron
# also uses.
#
# No weekday filter in the cron schedule itself -- deliberately fires every day, and
# /api/cron/enrich checks isNonBusinessDay(todayKstDate()) internally and no-ops on
# weekends/holidays. Filtering weekdays here would need the UTC-vs-KST calendar-day boundary
# handled correctly (a 23:00 UTC run for "Monday 08:00 KST" actually fires on Sunday UTC),
# which the route's own KST-aware check sidesteps entirely.
on:
  schedule:
    # KST 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00 = UTC 21:00, 23:00 (previous day),
    # 01:00, 03:00, 05:00, 07:00, 09:00
    - cron: '0 21,23,1,3,5,7,9 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/enrich
        run: |
          curl -sf -X GET "https://healthcare-intelligence-radar.vercel.app/api/cron/enrich" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 180
